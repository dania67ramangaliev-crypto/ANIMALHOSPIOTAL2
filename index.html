<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Казахские слова</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .word-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 18px 36px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
            transition: transform 0.1s;
        }
        .word-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Нажми на слово:</h1>
        <button class="word-btn" onclick="speakKazakh('тамақ')">тамақ 🔊</button>
    </div>

    <script>
        function speakKazakh(text) {
            if (!('speechSynthesis' in window)) {
                alert('Ваш браузер не поддерживает озвучку');
                return;
            }

            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'kk-KZ'; // Указываем казахский язык
            utterance.rate = 0.9;     // Чуть замедляем для четкости

            // Встроенный движок Safari на iPhone автоматически подберет лучший локальный голос
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
